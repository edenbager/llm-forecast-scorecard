name: watchdog

on:
  schedule:
    - cron: "17 9 * * 2-6"       # 09:17 UTC Tue-Sat: checks the call of the previous day (Mon-Fri), about 10 hours after the daily run is due
  workflow_dispatch: {}           # manual run for testing

permissions:
  contents: read
  issues: write                   # opens an issue when the check fails, so a failure reaches the owner without anyone watching

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history (74 commits on 15.11): config.json as of yesterday's run; 50 was too few on a 28-commit day
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.watchdog
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Bot check failed $(date -u +%F)" \
            --body "The watchdog found a problem with yesterday's call. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
