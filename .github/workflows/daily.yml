name: daily-run

on:
  schedule:
    - cron: "37 22 * * 1-5"      # 22:37 UTC Mon-Fri, after the US close in summer and winter; off the :00/:30 marks, where GitHub schedules are busiest (likely, not verified)
  workflow_dispatch: {}           # manual run for testing; before the close it fails loudly on purpose

concurrency:
  group: daily-run                # one run at a time, so two runs never write the same day
  cancel-in-progress: false

permissions:
  contents: write                 # the run commits its own results back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .      # offline tests; a broken change stops the run
      - run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
      - name: Free key check (count_tokens is not billed; prints only status codes and key shape)
        continue-on-error: true
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "key length=${#K} prefix=${K:0:7} has_whitespace=$([[ "$K" =~ [[:space:]] ]] && echo yes || echo no)"
          B='{"model":"claude-haiku-5-5","messages":[{"role":"user","content":"hi"}]}'
          U=https://api.anthropic.com/v1/messages/count_tokens
          echo "x-api-key -> $(curl -s -o /dev/null -w '%{http_code}' $U -H "x-api-key: $K" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d "$B")"
          echo "bearer    -> $(curl -s -o /dev/null -w '%{http_code}' $U -H "Authorization: Bearer $K" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d "$B")"
      - run: python -m bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # the key lives only in the repo secret
          BOT_MONTHLY_BUDGET_USD: ${{ vars.BOT_MONTHLY_BUDGET_USD }}   # optional repo variable; empty = 0.25, 0 = pause the LLM
